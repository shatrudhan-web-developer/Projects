<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card | @HelpmeCoder</title>
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <div class="center">
      <div class="profile">
        <div class="image">
          <div class="circle-1"></div>
          <div class="circle-2"></div>
          <img
            src="Logo.png"
            width="70"
            height="70"
          />
        </div>
        <div class="name">Helpme Coder</div>
        <div class="job">Web Developer & Editor</div>

        <div class="actions">
          <button class="btn">Follow</button>
          <button class="btn">Message</button>
        </div>
      </div>
      <div class="stats">
        <div class="box">
          <span class="value">48</span>
          <span class="parameter">Posts</span>
        </div>
        <div class="box">
          <span class="value">138K</span>
          <span class="parameter">Likes</span>
        </div>
        <div class="box">
          <span class="value">26.7M</span>
          <span class="parameter">Follower</span>
        </div>
      </div>
    </div>

    <script src="Script.js"></script>
  </body>
</html>
