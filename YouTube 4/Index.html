<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Select | @HelpmeCoder</title>
    <link rel="stylesheet" href="Style.css">
  </head>
  <body>
    <div class="multi-select" id="multiSelect">
      <div class="selected-items" id="selectedItems"></div>
      <div class="dropdown-arrow">&#9662;</div>
      <div class="dropdown" id="dropdown">
        <div data-value="apple">Shatrudhan</div>
        <div data-value="banana">Dipesh</div>
        <div data-value="cherry">Rishi</div>
        <div data-value="grape">Khadush</div>
        <div data-value="mango">Nethi</div>
      </div>
    </div>
    <script src="Script.js"></script>
  </body>
</html>
